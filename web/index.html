<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eBay Deal Alert Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #fbfcfd;
      --input: #ffffff;
      --text: #17202a;
      --muted: #5f6b7a;
      --line: #d7dde5;
      --primary: #176b87;
      --primary-dark: #0e5066;
      --danger: #b42318;
      --warning: #b45309;
      --success: #16794c;
      --focus: #f2b84b;
      --footer: rgba(246, 247, 249, 0.94);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111820;
        --panel: #18222d;
        --panel-soft: #202c38;
        --input: #101820;
        --text: #eef4f8;
        --muted: #a6b3bf;
        --line: #344352;
        --primary: #4aa3bd;
        --primary-dark: #2f8199;
        --danger: #ff8f82;
        --warning: #f7bf68;
        --success: #62d39c;
        --focus: #d99421;
        --footer: rgba(17, 24, 32, 0.94);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
    }

    .subhead {
      color: var(--muted);
      font-size: 0.94rem;
      margin: 0;
    }

    main {
      margin: 0 auto;
      max-width: 780px;
      padding: 14px 12px 100px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 14px;
      padding: 14px;
    }

    h2 {
      font-size: 1.02rem;
      margin: 0 0 12px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 650;
      margin-bottom: 6px;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--input);
      min-height: 46px;
      padding: 10px 11px;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus,
    button:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    input.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px var(--danger);
    }

    .tabs {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr 1fr;
      margin-bottom: 14px;
    }

    .tab {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
      margin-bottom: 12px;
    }

    .search-row,
    .activity-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-soft);
    }

    .search-row {
      margin-bottom: 10px;
    }

    .search-row.disabled {
      opacity: 0.62;
    }

    .search-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    .search-row-head,
    .filters {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-toggle {
      align-items: center;
      color: var(--text);
      display: inline-flex;
      font-size: 0.95rem;
      gap: 8px;
      margin: 0;
      min-height: 44px;
    }

    .search-toggle input {
      min-height: 24px;
      width: 24px;
    }

    .filter-field {
      flex: 1 1 170px;
    }

    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--input);
      min-height: 46px;
      padding: 10px 11px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    button {
      align-items: center;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      font-weight: 700;
      justify-content: center;
      min-height: 48px;
      padding: 10px 15px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }

    .primary:active {
      background: var(--primary-dark);
    }

    .secondary {
      background: #e8edf2;
      color: #17202a;
    }

    .danger {
      background: #f8d7d2;
      color: #8f1d14;
    }

    .footer-save {
      background: var(--footer);
      border-top: 1px solid var(--line);
      bottom: 0;
      left: 0;
      padding: 12px;
      position: fixed;
      right: 0;
      z-index: 3;
    }

    .footer-save-inner {
      margin: 0 auto;
      max-width: 780px;
    }

    .status {
      border-radius: 8px;
      display: none;
      margin: 0 0 14px;
      padding: 12px;
    }

    .status.success {
      background: #daf3e7;
      color: #0f5f3b;
      display: block;
    }

    .status.error {
      background: #fde2df;
      color: #8f1d14;
      display: block;
    }

    .run-status {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .run-status.bad {
      color: var(--danger);
      font-weight: 750;
    }

    @media (prefers-color-scheme: dark) {
      .secondary {
        background: #293746;
        color: var(--text);
      }

      .danger {
        background: #49201d;
        color: var(--danger);
      }

      .status.success {
        background: #163a2a;
        color: var(--success);
      }

      .status.error {
        background: #431f1d;
        color: var(--danger);
      }
    }

    .loading,
    .empty {
      color: var(--muted);
      padding: 20px 4px;
    }

    .activity-list {
      display: grid;
      gap: 10px;
    }

    .activity-head {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .activity-badges {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .activity-title {
      font-weight: 700;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .activity-meta,
    .activity-reason,
    .ledger-line,
    .context-line {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .ledger-line {
      margin-top: 6px;
    }

    .activity-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .activity-actions button,
    .small-button {
      min-height: 40px;
      padding: 8px 11px;
    }

    .stats-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    .stat-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 12px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .stat-detail {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
    }

    .badge {
      border-radius: 999px;
      flex: 0 0 auto;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
    }

    .badge.review {
      background: #dff5e9;
      color: #11633e;
    }

    .badge.pass {
      background: #e7ebf0;
      color: #495566;
    }

    .badge.warning {
      background: #fdecc8;
      color: #8a4b05;
    }

    .badge.rating-steal,
    .badge.rating-great-deal {
      background: #c9f2da;
      color: #0f5f3b;
    }

    .badge.rating-good-deal {
      background: #d8f3ef;
      color: #11655d;
    }

    .badge.rating-fair {
      background: #f7e7c2;
      color: #76520b;
    }

    .badge.rating-marginal {
      background: #e7ebf0;
      color: #5b6572;
    }

    @media (prefers-color-scheme: dark) {
      .badge.review {
        background: #173b2a;
        color: var(--success);
      }

      .badge.pass {
        background: #303a45;
        color: #c4cdd6;
      }

      .badge.warning {
        background: #47320f;
        color: var(--warning);
      }

      .badge.rating-steal,
      .badge.rating-great-deal {
        background: #173b2a;
        color: var(--success);
      }

      .badge.rating-good-deal {
        background: #153b38;
        color: #76d8ca;
      }

      .badge.rating-fair {
        background: #47360f;
        color: #e2bc61;
      }

      .badge.rating-marginal {
        background: #303a45;
        color: #c4cdd6;
      }
    }

    @media (min-width: 680px) {
      main {
        padding-left: 18px;
        padding-right: 18px;
      }

      .row.two {
        grid-template-columns: 1fr 1fr;
      }

      .search-grid {
        grid-template-columns: 2fr 1.2fr 0.9fr;
      }

      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Deal Alert Settings</h1>
    <p class="subhead">Edit saved searches, brand tiers, filters, and sizing limits.</p>
    <div id="runStatus" class="run-status">Last run: loading...</div>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button id="settingsTab" class="tab active" type="button">Settings</button>
      <button id="statsTab" class="tab" type="button">Stats</button>
      <button id="activityTab" class="tab" type="button">Recent Activity</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="app" class="loading">Loading settings...</div>
  </main>

  <div id="footerSave" class="footer-save">
    <div class="footer-save-inner">
      <button id="saveButton" class="primary" type="button" disabled>Save Changes</button>
    </div>
  </div>

  <script>
    const PASSWORD_KEY = "ebay-deal-alert.settingsPassword";
    const app = document.getElementById("app");
    const statusBox = document.getElementById("status");
    const saveButton = document.getElementById("saveButton");
    const footerSave = document.getElementById("footerSave");
    const settingsTab = document.getElementById("settingsTab");
    const statsTab = document.getElementById("statsTab");
    const activityTab = document.getElementById("activityTab");
    const runStatus = document.getElementById("runStatus");
    let config = null;
    let configSha = null;
    let loadedSnapshot = "";
    let activeTab = "settings";
    let historyItems = null;
    let historySkipped = 0;
    let ledgerItems = null;
    let activityFilters = { query: "all", rating: "all", title: "" };

    const ratings = ["Steal", "Great Deal", "Good Deal", "Fair", "Marginal"];
    const textListFields = [
      ["GRAB_ON_SIGHT_BRANDS", "Grab-on-sight Brands"],
      ["STANDARD_BRANDS", "Standard Brands"],
      ["PASS_BRANDS", "Pass Brands"],
      ["CORPORATE_LOGO_KEYWORDS", "Corporate Logo Keywords"],
      ["CONDITION_HARD_FAIL_KEYWORDS", "Condition Hard-Fail Keywords"],
      ["CONDITION_FLAG_KEYWORDS", "Condition Flag Keywords"],
      ["FABRIC_GOOD_KEYWORDS", "Fabric Good Keywords"],
      ["GENDER_EXCLUDE_KEYWORDS", "Gender Exclude Keywords"]
    ];

    function getPassword() {
      let password = localStorage.getItem(PASSWORD_KEY);
      while (!password) {
        password = window.prompt("Settings password");
        if (password === null) {
          throw new Error("Password required");
        }
        password = password.trim();
      }
      localStorage.setItem(PASSWORD_KEY, password);
      return password;
    }

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    async function apiFetch(path, options = {}) {
      const password = getPassword();
      const headers = {
        "x-settings-password": password,
        ...(options.headers || {})
      };
      const response = await fetch(path, { ...options, headers });
      if (response.status === 401) {
        localStorage.removeItem(PASSWORD_KEY);
        showStatus("Wrong password. Please try again.", "error");
        return apiFetch(path, options);
      }
      return response;
    }

    function linesToArray(value) {
      return value
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function arrayToLines(value) {
      return Array.isArray(value) ? value.join("\n") : "";
    }

    function sizeToText(size) {
      return Array.isArray(size) ? size.join(", ") : "";
    }

    function textToSize(value) {
      const parts = value.split(",").map((part) => part.trim()).filter(Boolean);
      return parts.length ? parts : null;
    }

    function fieldId(key) {
      return `field-${key}`;
    }

    function stableStringify(value) {
      return JSON.stringify(value);
    }

    function countLines(value) {
      return linesToArray(value).length;
    }

    function labelWithCount(label, values) {
      return `${label} (${Array.isArray(values) ? values.filter(Boolean).length : 0})`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function numberValue(value) {
      if (value == null || (typeof value === "string" && !value.trim())) {
        return null;
      }
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function money(value) {
      const number = numberValue(value);
      return number == null ? "$0" : number.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    }

    function updateListCounts() {
      for (const [key, label] of textListFields) {
        const textarea = document.getElementById(fieldId(key));
        const labelEl = document.querySelector(`[data-count-label="${key}"]`);
        if (textarea && labelEl) {
          labelEl.textContent = `${label} (${countLines(textarea.value)})`;
        }
      }
    }

    function markBlankMaxPrices() {
      document.querySelectorAll('[data-field="max_price"]').forEach((input) => {
        input.classList.toggle("invalid", input.value.trim() === "");
      });
    }

    function hasBlankMaxPrice() {
      return Array.from(document.querySelectorAll('[data-field="max_price"]'))
        .some((input) => input.value.trim() === "");
    }

    function collectConfig() {
      const nextConfig = { ...config };
      // Spread the ORIGINAL search object first so unedited/unmodeled
      // fields (category_id, or any future field the UI doesn't have an
      // input for) survive a save instead of silently vanishing - this
      // was a real data-loss bug: category_id fixes applied directly to
      // config.json were getting wiped the next time anyone hit Save here.
      nextConfig.SAVED_SEARCHES = Array.from(document.querySelectorAll("[data-search-index]")).map((row) => {
        const original = (config.SAVED_SEARCHES || [])[Number(row.dataset.searchIndex)] || {};
        return {
          ...original,
          query: row.querySelector('[data-field="query"]').value.trim(),
          size: textToSize(row.querySelector('[data-field="size"]').value),
          max_price: Number(row.querySelector('[data-field="max_price"]').value),
          enabled: row.querySelector('[data-field="enabled"]').checked,
          profile: row.dataset.profile || "fast"
        };
      });

      for (const [key] of textListFields) {
        nextConfig[key] = linesToArray(document.getElementById(fieldId(key)).value);
      }

      nextConfig.FABRIC_POLY_KEYWORD = document.getElementById("fabricPoly").value.trim();
      nextConfig.PIT_TO_PIT_CAP_INCHES = Number(document.getElementById("pitCap").value || 0);
      return nextConfig;
    }

    function setActiveTab(tabName) {
      activeTab = tabName;
      settingsTab.classList.toggle("active", tabName === "settings");
      statsTab.classList.toggle("active", tabName === "stats");
      activityTab.classList.toggle("active", tabName === "activity");
      footerSave.style.display = tabName === "settings" ? "" : "none";
      saveButton.disabled = tabName !== "settings";
    }

    function updateDirtyState() {
      if (!config || activeTab !== "settings") {
        saveButton.disabled = true;
        return;
      }
      markBlankMaxPrices();
      saveButton.disabled = stableStringify(collectConfig()) === loadedSnapshot;
    }

    function attachDirtyListeners() {
      app.querySelectorAll("input, textarea").forEach((field) => {
        field.addEventListener("input", () => {
          updateListCounts();
          updateDirtyState();
        });
        field.addEventListener("change", () => {
          updateDirtyState();
        });
      });
    }

    function renderSettings() {
      setActiveTab("settings");

      const searchRows = config.SAVED_SEARCHES.map((search, index) => {
        const enabled = search.enabled !== false;
        const profile = typeof search.profile === "string" && search.profile ? search.profile : "fast";
        return `
          <div class="search-row ${enabled ? "" : "disabled"}" data-search-index="${index}" data-profile="${escapeHtml(profile)}">
            <div class="search-row-head">
              <label class="search-toggle" for="search-enabled-${index}">
                <input id="search-enabled-${index}" data-field="enabled" type="checkbox" ${enabled ? "checked" : ""}>
                ${enabled ? "Active" : "Paused"}
              </label>
              <span class="badge pass">${escapeHtml(profile)}</span>
            </div>
            <div class="search-grid">
              <div>
                <label for="search-query-${index}">Query</label>
                <input id="search-query-${index}" data-field="query" value="${escapeHtml(search.query || "")}" autocomplete="off">
              </div>
              <div>
                <label for="search-size-${index}">Size</label>
                <input id="search-size-${index}" data-field="size" value="${escapeHtml(sizeToText(search.size))}" placeholder="Any size (leave blank)" autocomplete="off">
              </div>
              <div>
                <label for="search-price-${index}">Max price</label>
                <input id="search-price-${index}" data-field="max_price" type="number" min="0" step="0.01" value="${search.max_price === "" ? "" : Number(search.max_price || 0)}">
              </div>
            </div>
            <div class="button-row">
              <button class="danger delete-search" type="button">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      const listSections = textListFields.map(([key, label]) => `
        <div class="row">
          <div>
            <label for="${fieldId(key)}" data-count-label="${key}">${labelWithCount(label, config[key])}</label>
            <textarea id="${fieldId(key)}" data-config-key="${key}" spellcheck="false">${escapeHtml(arrayToLines(config[key]))}</textarea>
          </div>
        </div>
      `).join("");

      app.className = "";
      app.innerHTML = `
        <section>
          <h2>Saved Searches</h2>
          <div id="searches">${searchRows}</div>
          <button id="addSearch" class="secondary" type="button">Add search</button>
        </section>

        <section>
          <h2>Brand Tiers</h2>
          ${listSections}
        </section>

        <section>
          <h2>Fabric and Fit</h2>
          <div class="row two">
            <div>
              <label for="fabricPoly">Fabric Poly Keyword</label>
              <input id="fabricPoly" value="${escapeHtml(config.FABRIC_POLY_KEYWORD || "")}" autocomplete="off">
            </div>
            <div>
              <label for="pitCap">Pit-to-pit cap inches</label>
              <input id="pitCap" type="number" min="0" step="0.1" value="${Number(config.PIT_TO_PIT_CAP_INCHES || 0)}">
            </div>
          </div>
        </section>
      `;

      document.getElementById("addSearch").addEventListener("click", () => {
        config = collectConfig();
        config.SAVED_SEARCHES.push({ query: "", size: null, max_price: "", enabled: true, profile: "fast" });
        renderSettings();
        updateDirtyState();
      });

      document.querySelectorAll('[data-field="enabled"]').forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const label = checkbox.closest(".search-toggle");
          label.lastChild.textContent = checkbox.checked ? "Active" : "Paused";
          checkbox.closest(".search-row").classList.toggle("disabled", !checkbox.checked);
        });
      });

      document.querySelectorAll(".delete-search").forEach((button) => {
        button.addEventListener("click", (event) => {
          if (!window.confirm("Delete this saved search?")) {
            return;
          }
          const row = event.target.closest("[data-search-index]");
          config = collectConfig();
          config.SAVED_SEARCHES.splice(Number(row.dataset.searchIndex), 1);
          renderSettings();
          updateDirtyState();
        });
      });

      attachDirtyListeners();
      updateDirtyState();
    }

    function formatTime(timestamp) {
      if (!timestamp) {
        return "";
      }
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) {
        return "";
      }
      const diffSeconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (diffSeconds < 60) {
        return "just now";
      }
      if (diffSeconds < 3600) {
        return `${Math.floor(diffSeconds / 60)}m ago`;
      }
      if (diffSeconds < 86400) {
        return `${Math.floor(diffSeconds / 3600)}h ago`;
      }
      return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    async function loadData() {
      if (historyItems && ledgerItems) {
        return;
      }
      const [historyResponse, ledgerResponse] = await Promise.all([
        historyItems ? Promise.resolve(null) : apiFetch("/api/history"),
        ledgerItems ? Promise.resolve(null) : apiFetch("/api/ledger")
      ]);
      if (historyResponse && !historyResponse.ok) {
        const error = await historyResponse.json().catch(() => ({ error: "Failed to load activity" }));
        throw new Error(error.error || "Failed to load activity");
      }
      if (ledgerResponse && !ledgerResponse.ok) {
        const error = await ledgerResponse.json().catch(() => ({ error: "Failed to load ledger" }));
        throw new Error(error.error || "Failed to load ledger");
      }
      if (historyResponse) {
        const payload = await historyResponse.json();
        historyItems = Array.isArray(payload?.history) ? payload.history : [];
        historySkipped = Number.isInteger(payload?.skipped) && payload.skipped > 0 ? payload.skipped : 0;
      }
      if (ledgerResponse) {
        ledgerItems = await ledgerResponse.json();
      }
    }

    function ledgerMap() {
      return new Map((ledgerItems || []).map((entry) => [String(entry.item_id), entry]));
    }

    function filterHistory(items) {
      const titleNeedle = activityFilters.title.trim().toLowerCase();
      return items.filter((item) => {
        if (activityFilters.query !== "all" && (item.query || "") !== activityFilters.query) {
          return false;
        }
        if (activityFilters.rating !== "all") {
          const value = activityFilters.rating === "PASS" ? item.verdict : item.deal_rating;
          if (String(value || "").toUpperCase() !== activityFilters.rating.toUpperCase()) {
            return false;
          }
        }
        return !titleNeedle || String(item.title || "").toLowerCase().includes(titleNeedle);
      });
    }

    function renderStatsSection(items, ledger, compact = false) {
      const now = Date.now();
      const actualAlerts = items.filter((item) => item.verdict === "REVIEW");
      const windows = [
        ["7 days", 7],
        ["30 days", 30]
      ];
      const historyStats = windows.map(([label, days]) => {
        const start = now - days * 86400000;
        const windowItems = actualAlerts.filter((item) => {
          const time = new Date(item.timestamp).getTime();
          return Number.isFinite(time) && time >= start;
        });
        const discounts = windowItems.map((item) => numberValue(item.discount_pct)).filter((value) => value != null);
        const byRating = ratings.map((rating) => `${rating}: ${windowItems.filter((item) => item.deal_rating === rating).length}`).join(" | ");
        return {
          label,
          count: windowItems.length,
          averageDiscount: discounts.length ? discounts.reduce((sum, value) => sum + value, 0) / discounts.length : null,
          byRating
        };
      });
      const rollingThirtyDayStart = now - 30 * 86400000;
      const potentialMargin = actualAlerts.reduce((sum, item) => {
        const time = new Date(item.timestamp).getTime();
        if (!Number.isFinite(time) || time < rollingThirtyDayStart || !["Steal", "Great Deal"].includes(item.deal_rating)) {
          return sum;
        }
        const resale = numberValue(item.estimated_resale_value);
        const price = numberValue(item.price);
        return resale == null || price == null ? sum : sum + resale - price;
      }, 0);
      const soldEntries = ledger.filter((entry) => numberValue(entry.sold_price) != null);
      const grossSales = soldEntries.reduce((sum, entry) => sum + numberValue(entry.sold_price), 0);
      const soldCostBasis = soldEntries.reduce((sum, entry) => sum + (numberValue(entry.bought_price) || 0), 0);
      const openInventory = ledger.filter((entry) => numberValue(entry.bought_price) != null && numberValue(entry.sold_price) == null).length;
      const openInventoryCost = ledger.reduce((sum, entry) => {
        const boughtPrice = numberValue(entry.bought_price);
        return boughtPrice != null && numberValue(entry.sold_price) == null ? sum + boughtPrice : sum;
      }, 0);
      const netProfit = grossSales - soldCostBasis;
      const content = `
        <div class="stats-grid">
          ${historyStats.map((stat) => `
            <div class="stat-box">
              <div class="stat-label">Alerts, last ${escapeHtml(stat.label)}</div>
              <div class="stat-value">${stat.count}</div>
              <div class="stat-detail">Avg discount: ${stat.averageDiscount == null ? "n/a" : `${Math.round(stat.averageDiscount)}%`}</div>
              <div class="stat-detail">${escapeHtml(stat.byRating)}</div>
            </div>
          `).join("")}
          <div class="stat-box">
            <div class="stat-label">Potential margin if all Steals/Great Deals in the last 30 days were bought</div>
            <div class="stat-value">${money(potentialMargin)}</div>
            <div class="stat-detail">Rough estimate, not a guarantee.</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Ledger net profit</div>
            <div class="stat-value">${money(netProfit)}</div>
            <div class="stat-detail">Gross sales ${money(grossSales)} | sold cost basis ${money(soldCostBasis)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Open inventory</div>
            <div class="stat-value">${openInventory}</div>
            <div class="stat-detail">Cost ${money(openInventoryCost)} | bought but not yet sold.</div>
          </div>
        </div>
        ${compact ? "" : '<div class="button-row"><button id="exportLedger" class="secondary small-button" type="button">Export Ledger</button></div>'}
      `;
      return compact ? content : `<section><h2>Stats</h2>${content}</section>`;
    }

    function renderActivityFilters(items) {
      const queries = Array.from(new Set(items.map((item) => item.query).filter(Boolean))).sort();
      const queryOptions = queries.map((query) => `<option value="${escapeHtml(query)}" ${activityFilters.query === query ? "selected" : ""}>${escapeHtml(query)}</option>`).join("");
      const ratingOptions = ["all", ...ratings, "PASS"].map((rating) => `<option value="${escapeHtml(rating)}" ${activityFilters.rating === rating ? "selected" : ""}>${escapeHtml(rating === "all" ? "All ratings" : rating)}</option>`).join("");
      return `
        <div class="filters">
          <div class="filter-field">
            <label for="queryFilter">Search</label>
            <select id="queryFilter">
              <option value="all">All searches</option>
              ${queryOptions}
            </select>
          </div>
          <div class="filter-field">
            <label for="ratingFilter">Rating</label>
            <select id="ratingFilter">${ratingOptions}</select>
          </div>
          <div class="filter-field">
            <label for="titleFilter">Title contains</label>
            <input id="titleFilter" value="${escapeHtml(activityFilters.title)}" autocomplete="off">
          </div>
        </div>
      `;
    }

    function renderHistoryItems(items) {
      if (!items.length) {
        return '<div class="empty">No activity matches these filters.</div>';
      }
      const ratingClasses = {
        "Steal": "rating-steal",
        "Great Deal": "rating-great-deal",
        "Good Deal": "rating-good-deal",
        "Fair": "rating-fair",
        "Marginal": "rating-marginal"
      };
      const map = ledgerMap();
      const formatEstimate = (value) => {
        const amount = Number(value);
        return Number.isFinite(amount) ? `$${Math.round(amount)}` : "";
      };
      return `
        <div class="activity-list">
          ${items.map((item) => {
            const badgeClass = item.ai_flagged ? "warning" : String(item.verdict || "").toLowerCase();
            const ratingClass = ratingClasses[item.deal_rating] || "rating-marginal";
            // discount_pct is signed: positive = under resale (a real deal),
            // negative = over resale (overpaying) - unbounded since the
            // backend clamp was removed, so it can be e.g. -202. A hardcoded
            // "-" prefix here used to double up into "--202%" on a bad
            // listing, and made a genuine +67% steal read as "-67%" which,
            // while a common discount-display convention, stopped being
            // unambiguous the moment the sign could flip. Spell it out
            // instead - matches the phone alert's "X% under resale" wording.
            const discountValue = item.discount_pct == null ? null : Math.round(Number(item.discount_pct));
            const discountText = discountValue == null ? "" :
              (discountValue >= 0 ? ` ${discountValue}% under resale` : ` ${Math.abs(discountValue)}% OVER resale`);
            const ratingText = item.deal_rating ? `${item.deal_rating}${Number.isFinite(Number(item.discount_pct)) ? discountText : ""}` : "";
            const confidenceTitle = item.price_confidence ? ` title="Confidence: ${escapeHtml(item.price_confidence)}"` : "";
            const retailEstimate = formatEstimate(item.estimated_retail_price);
            const resaleEstimate = formatEstimate(item.estimated_resale_value);
            const estimateParts = [];
            const count = numberValue(item.similar_listings_count ?? item.search_total_listings);
            const ledgerEntry = item.item_id == null ? null : map.get(String(item.item_id));
            const profit = ledgerEntry && numberValue(ledgerEntry.sold_price) != null && numberValue(ledgerEntry.bought_price) != null
              ? numberValue(ledgerEntry.sold_price) - numberValue(ledgerEntry.bought_price)
              : null;
            if (retailEstimate) {
              estimateParts.push(`retail ${retailEstimate}`);
            }
            if (resaleEstimate) {
              estimateParts.push(`resale ${resaleEstimate}`);
            }
            const estimateLine = estimateParts.length ? `Est. ${estimateParts.join(" -> ")}` : "";
            const contextLine = count == null ? "" : `${count} similar listings currently active`;
            const ledgerLine = ledgerEntry ? [
              numberValue(ledgerEntry.bought_price) == null ? "" : `Bought ${money(ledgerEntry.bought_price)}`,
              numberValue(ledgerEntry.sold_price) == null ? "" : `Sold ${money(ledgerEntry.sold_price)}${profit == null ? "" : ` (${profit >= 0 ? "+" : ""}${money(profit)})`}`
            ].filter(Boolean).join(" | ") : "";
            return `
              <div class="activity-item">
                <div class="activity-head">
                  <div class="activity-badges">
                    <span class="badge ${escapeHtml(badgeClass)}">${escapeHtml(item.ai_flagged ? "AI" : item.verdict || "ITEM")}</span>
                    ${ratingText ? `<span class="badge ${escapeHtml(ratingClass)}"${confidenceTitle}>${escapeHtml(ratingText)}</span>` : ""}
                    ${item.liquidity ? `<span class="badge pass">${escapeHtml(item.liquidity)}</span>` : ""}
                    ${item.query ? `<span class="badge pass">${escapeHtml(item.query)}</span>` : ""}
                  </div>
                  <span class="activity-meta">${escapeHtml(formatTime(item.timestamp))}</span>
                </div>
                <div class="activity-title">${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title || "Untitled listing")}</a>` : escapeHtml(item.title || "Untitled listing")}</div>
                <div class="activity-meta">${item.item_price != null && item.shipping_cost != null ? escapeHtml(`$${item.item_price} + $${item.shipping_cost} shipping = $${item.price} total`) : (item.price == null ? "" : `$${escapeHtml(item.price)}`)}</div>
                <div class="activity-reason">${escapeHtml(item.reason || "")}</div>
                ${estimateLine ? `<div class="activity-meta">${escapeHtml(estimateLine)}</div>` : ""}
                ${contextLine ? `<div class="context-line">${escapeHtml(contextLine)}</div>` : ""}
                ${ledgerLine ? `<div class="ledger-line">${escapeHtml(ledgerLine)}</div>` : ""}
                ${item.item_id ? `
                  <div class="activity-actions">
                    <button class="secondary small-button ledger-bought" type="button" data-item-id="${escapeHtml(item.item_id)}">Mark Bought</button>
                    <button class="secondary small-button ledger-sold" type="button" data-item-id="${escapeHtml(item.item_id)}">Mark Sold</button>
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function attachActivityListeners() {
      document.getElementById("queryFilter")?.addEventListener("change", (event) => {
        activityFilters.query = event.target.value;
        renderActivity();
      });
      document.getElementById("ratingFilter")?.addEventListener("change", (event) => {
        activityFilters.rating = event.target.value;
        renderActivity();
      });
      document.getElementById("titleFilter")?.addEventListener("input", (event) => {
        activityFilters.title = event.target.value;
        renderActivity(true);
      });
      document.querySelectorAll(".ledger-bought").forEach((button) => {
        button.addEventListener("click", () => markBought(button.dataset.itemId));
      });
      document.querySelectorAll(".ledger-sold").forEach((button) => {
        button.addEventListener("click", () => markSold(button.dataset.itemId));
      });
    }

    function findHistoryItem(itemId) {
      return (historyItems || []).find((item) => String(item.item_id) === String(itemId)) || {};
    }

    function todayIsoDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    async function saveLedgerEntry(entry) {
      const response = await apiFetch("/api/ledger", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry)
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({ error: "Failed to save ledger entry" }));
        throw new Error(error.error || "Failed to save ledger entry");
      }
      ledgerItems = await response.json();
      renderActivity();
    }

    async function markBought(itemId) {
      const item = findHistoryItem(itemId);
      const existing = ledgerMap().get(String(itemId)) || {};
      const paid = window.prompt("Actual price paid", existing.bought_price ?? item.price ?? "");
      if (paid === null) {
        return;
      }
      const paidText = paid.trim();
      const boughtPrice = Number(paidText);
      if (!paidText || !Number.isFinite(boughtPrice) || boughtPrice < 0) {
        showStatus("Bought price must be a non-negative number.", "error");
        return;
      }
      const date = window.prompt("Bought date", existing.bought_date || todayIsoDate());
      if (date === null) {
        return;
      }
      try {
        clearStatus();
        await saveLedgerEntry({
          ...existing,
          item_id: String(itemId),
          title: existing.title || item.title || "",
          bought_price: boughtPrice,
          bought_date: date || null
        });
        showStatus("Ledger updated.", "success");
      } catch (error) {
        showStatus(error.message, "error");
      }
    }

    async function markSold(itemId) {
      const item = findHistoryItem(itemId);
      const existing = ledgerMap().get(String(itemId)) || {};
      const sold = window.prompt("Sold price", existing.sold_price ?? "");
      if (sold === null) {
        return;
      }
      const soldText = sold.trim();
      const soldPrice = Number(soldText);
      if (!soldText || !Number.isFinite(soldPrice) || soldPrice < 0) {
        showStatus("Sold price must be a non-negative number.", "error");
        return;
      }
      const platform = window.prompt("Sold platform", existing.sold_platform || "");
      if (platform === null) {
        return;
      }
      const date = window.prompt("Sold date", existing.sold_date || todayIsoDate());
      if (date === null) {
        return;
      }
      try {
        clearStatus();
        await saveLedgerEntry({
          ...existing,
          item_id: String(itemId),
          title: existing.title || item.title || "",
          sold_price: soldPrice,
          sold_platform: platform || null,
          sold_date: date || null
        });
        showStatus("Ledger updated.", "success");
      } catch (error) {
        showStatus(error.message, "error");
      }
    }

    function renderActivity(focusTitle = false) {
      setActiveTab("activity");
      const filtered = filterHistory(historyItems || []);
      const skippedNote = historySkipped
        ? `<p class="activity-meta">${historySkipped} malformed histor${historySkipped === 1 ? "y entry was" : "y entries were"} skipped.</p>`
        : "";
      app.className = "";
      app.innerHTML = `
        <section><h2>Stats</h2>${renderStatsSection(historyItems || [], ledgerItems || [], true)}</section>
        <section>
          <h2>Recent Activity</h2>
          ${skippedNote}
          ${renderActivityFilters(historyItems || [])}
          ${renderHistoryItems(filtered)}
        </section>
      `;
      attachActivityListeners();
      if (focusTitle) {
        const titleFilter = document.getElementById("titleFilter");
        titleFilter?.focus();
        titleFilter?.setSelectionRange(titleFilter.value.length, titleFilter.value.length);
      }
    }

    async function loadHistory() {
      setActiveTab("activity");
      app.className = "loading";
      app.textContent = "Loading activity...";
      try {
        clearStatus();
        await loadData();
        renderActivity();
      } catch (error) {
        app.className = "loading";
        app.textContent = error.message;
        showStatus(error.message, "error");
      }
    }

    function exportLedger() {
      const jsonl = (ledgerItems || []).map((entry) => JSON.stringify(entry)).join("\n") + ((ledgerItems || []).length ? "\n" : "");
      const blob = new Blob([jsonl], { type: "application/x-ndjson" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "ledger.jsonl";
      link.click();
      URL.revokeObjectURL(url);
    }

    async function loadStats() {
      setActiveTab("stats");
      app.className = "loading";
      app.textContent = "Loading stats...";
      try {
        clearStatus();
        await loadData();
        app.className = "";
        app.innerHTML = renderStatsSection(historyItems || [], ledgerItems || []);
        document.getElementById("exportLedger")?.addEventListener("click", exportLedger);
      } catch (error) {
        app.className = "loading";
        app.textContent = error.message;
        showStatus(error.message, "error");
      }
    }

    async function loadRunStatus() {
      try {
        const response = await apiFetch("/api/status");
        if (!response.ok) {
          throw new Error("unavailable");
        }
        const latest = await response.json();
        const result = latest.conclusion || latest.status || "unknown";
        runStatus.textContent = `Last run: ${formatTime(latest.updated_at || latest.created_at)} (${result})`;
        runStatus.classList.toggle("bad", latest.conclusion && latest.conclusion !== "success");
      } catch (error) {
        runStatus.textContent = "Last run: unavailable";
        runStatus.classList.add("bad");
      }
    }

    async function loadConfig() {
      try {
        clearStatus();
        const response = await apiFetch("/api/config");
        if (!response.ok) {
          const error = await response.json().catch(() => ({ error: "Failed to load config" }));
          throw new Error(error.error || "Failed to load config");
        }
        const payload = await response.json();
        config = payload.config;
        configSha = payload.sha;
        if (!config || typeof config !== "object" || !configSha) {
          throw new Error("Config API returned an invalid snapshot");
        }
        if (!Array.isArray(config.SAVED_SEARCHES)) {
          config.SAVED_SEARCHES = [];
        }
        loadedSnapshot = stableStringify(config);
        renderSettings();
      } catch (error) {
        app.className = "loading";
        app.textContent = error.message;
        showStatus(error.message, "error");
      }
    }

    saveButton.addEventListener("click", async () => {
      try {
        clearStatus();
        markBlankMaxPrices();
        if (hasBlankMaxPrice()) {
          showStatus("Max price can't be blank - enter a value or remove the search", "error");
          return;
        }
        const nextConfig = collectConfig();
        if (stableStringify(nextConfig) === loadedSnapshot) {
          updateDirtyState();
          return;
        }
        saveButton.disabled = true;
        const response = await apiFetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ config: nextConfig, baseSha: configSha })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({ error: "Failed to save config" }));
          throw new Error(error.error || error.message || "Failed to save config");
        }
        const payload = await response.json();
        config = payload.config || nextConfig;
        configSha = payload.sha || configSha;
        loadedSnapshot = stableStringify(config);
        showStatus("Settings saved.", "success");
        updateDirtyState();
      } catch (error) {
        showStatus(error.message, "error");
        updateDirtyState();
      }
    });

    settingsTab.addEventListener("click", () => {
      if (config) {
        renderSettings();
      } else {
        loadConfig();
      }
    });

    statsTab.addEventListener("click", loadStats);
    activityTab.addEventListener("click", loadHistory);

    loadRunStatus();
    loadConfig();
  </script>
</body>
</html>
