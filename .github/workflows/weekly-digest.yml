name: Weekly Deal Digest

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-deal-digest
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Vinted fast-lane alerts
        uses: actions/cache/restore@v4
        with:
          path: |
            vinted_fast_seen.db
            vinted_fast_state.json
            vinted_fast_log.jsonl
          key: vinted-fast-state-v1-digest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vinted-fast-state-v1-

      - name: Send weekly digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ebay_deal_alert.py --weekly-digest
