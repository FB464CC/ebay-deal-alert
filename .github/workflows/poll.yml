name: Poll eBay Deals

on:
  schedule:
    # Tightened now that the repo is public (unlimited free Actions
    # minutes - cost is no longer a constraint on interval). Still offset
    # from round minutes deliberately - GitHub's scheduler gets congested
    # at :00/:05/:10 etc (every cron job on the platform targets round
    # numbers) and silently drops/delays runs; confirmed live earlier that
    # a 20-min cron was actually landing ~55min apart on average, not 20.
    # 5-min granularity is roughly GitHub's practical floor for `schedule:`
    # reliability - tighter than this needs the external-trigger bypass
    # (see README) since GitHub's own scheduler just won't hit it.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-ebay-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        # Facebook Marketplace adapter (facebook_marketplace.py) needs a
        # real browser - --with-deps pulls the Ubuntu system libs Chromium
        # needs, which apt provides here (Linux-only flag, do not run this
        # locally on Windows - the browser binary itself is separate from
        # the playwright pip package installed above).
        run: playwright install --with-deps chromium

      - name: Run eBay deal alert
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          WARDROBE_OS_URL: ${{ secrets.WARDROBE_OS_URL }}
          WARDROBE_OS_SECRET: ${{ secrets.WARDROBE_OS_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACEBOOK_PROXY_URL: ${{ secrets.FACEBOOK_PROXY_URL }}
          EBAY_SCRAPE_PROXY_URL: ${{ secrets.EBAY_SCRAPE_PROXY_URL }}
          SHOPGOODWILL_PROXY_URL: ${{ secrets.SHOPGOODWILL_PROXY_URL }}
        run: python ebay_deal_alert.py

      - name: Commit seen item updates
        run: |
          if [ -n "$(git status --porcelain seen_items.db alerts_log.jsonl ebay_rate_limit_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for file in seen_items.db alerts_log.jsonl ebay_rate_limit_state.json; do
              if [ -e "$file" ]; then
                git add "$file"
              fi
            done
            git commit -m "chore: update seen items [skip ci]"
            if git pull --rebase origin main; then
              git push
            else
              # Binary files (seen_items.db, a SQLite DB) can't be
              # line-merged, so two runs racing to commit close together
              # (native schedule + the 5-min external trigger + manual
              # dispatches all landing near-simultaneously) sometimes hits
              # a real rebase conflict here - confirmed live, it failed
              # the whole job over this. All three files are low-stakes,
              # self-healing state (a dedupe cache, an append-only log, a
              # backoff timer) - dropping this run's specific update is
              # harmless (worst case: one item re-scored, one extra probe
              # of a rate limit), so abort the rebase and move on instead
              # of failing the job over a binary-file merge conflict.
              echo "Rebase conflict on state files - discarding this run's local update, not failing the job"
              git rebase --abort
            fi
          else
            echo "poll state files unchanged"
          fi

      # Independent failure-detection layer: pings healthchecks.io on
      # success, and separately on any earlier step failing. If neither
      # ping arrives within the check's grace window, healthchecks.io
      # alerts on its own - catches total bot death (expired keys, GitHub
      # account issues, runner outage) that the bot's own self-reporting
      # can't, since that fails when the whole process can't run at all.
      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}"

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}/fail"
