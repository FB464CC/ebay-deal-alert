name: Poll eBay Deals

on:
  schedule:
    # Tightened now that the repo is public (unlimited free Actions
    # minutes - cost is no longer a constraint on interval). Still offset
    # from round minutes deliberately - GitHub's scheduler gets congested
    # at :00/:05/:10 etc (every cron job on the platform targets round
    # numbers) and silently drops/delays runs; confirmed live earlier that
    # a 20-min cron was actually landing ~55min apart on average, not 20.
    # 5-min granularity is roughly GitHub's practical floor for `schedule:`
    # reliability - tighter than this needs the external-trigger bypass
    # (see README) since GitHub's own scheduler just won't hit it.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-ebay-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Runs every 5 min - a wedged network call must never be allowed to
    # hang indefinitely and eat the whole runner-minutes budget.
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eBay deal alert
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          WARDROBE_OS_URL: ${{ secrets.WARDROBE_OS_URL }}
          WARDROBE_OS_SECRET: ${{ secrets.WARDROBE_OS_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACEBOOK_PROXY_URL: ${{ secrets.FACEBOOK_PROXY_URL }}
          EBAY_SCRAPE_PROXY_URL: ${{ secrets.EBAY_SCRAPE_PROXY_URL }}
          SHOPGOODWILL_PROXY_URL: ${{ secrets.SHOPGOODWILL_PROXY_URL }}
        run: python ebay_deal_alert.py

      - name: Commit seen item updates
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen_items.db ai_spend.db alerts_log.jsonl ebay_rate_limit_state.json shopgoodwill_rate_limit_state.json vinted_rate_limit_state.json scout_queue.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for file in seen_items.db ai_spend.db alerts_log.jsonl ebay_rate_limit_state.json shopgoodwill_rate_limit_state.json vinted_rate_limit_state.json scout_queue.jsonl; do
              if [ -e "$file" ]; then
                git add "$file"
              fi
            done
            git commit -m "chore: update seen items [skip ci]"
            if git pull --rebase origin main; then
              git push
            else
              # The dedupe/log/backoff/queue state is safe to take from
              # origin on a conflict. ai_spend.db is deliberately excluded:
              # losing its local reservation could breach the monthly cap.
              echo "Rebase conflict on retryable state files - keeping origin copies while preserving ai_spend.db"
              for file in seen_items.db alerts_log.jsonl ebay_rate_limit_state.json shopgoodwill_rate_limit_state.json vinted_rate_limit_state.json scout_queue.jsonl; do
                if git cat-file -e "origin/main:$file" 2>/dev/null; then
                  git checkout origin/main -- "$file"
                  git add "$file"
                else
                  git rm -f --ignore-unmatch "$file"
                fi
              done
              if GIT_EDITOR=true git rebase --continue; then
                git push
              else
                echo "Could not preserve the paid-AI ledger during rebase; failing closed"
                git rebase --abort || true
                exit 1
              fi
            fi
          else
            echo "poll state files unchanged"
          fi

      # Independent failure-detection layer: pings healthchecks.io on
      # success, and separately on any earlier step failing. If neither
      # ping arrives within the check's grace window, healthchecks.io
      # alerts on its own - catches total bot death (expired keys, GitHub
      # account issues, runner outage) that the bot's own self-reporting
      # can't, since that fails when the whole process can't run at all.
      - name: Ping healthchecks.io (success)
        if: success() && env.HEALTHCHECKS_PING_URL != ''
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}"

      - name: Ping healthchecks.io (failure)
        if: failure() && env.HEALTHCHECKS_PING_URL != ''
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}/fail"
