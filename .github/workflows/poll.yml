name: Poll eBay Deals

on:
  schedule:
    # Offset from :00/:20/:40 deliberately - GitHub's scheduler gets
    # congested at round minute-boundaries (every cron job on the platform
    # targets them too) and silently delays runs. Confirmed against this
    # repo's actual run history: */20 was landing ~63 min apart on average,
    # not 20 - a real latency bug for a "catch it first" flipping tool.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-ebay-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eBay deal alert
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          WARDROBE_OS_URL: ${{ secrets.WARDROBE_OS_URL }}
          WARDROBE_OS_SECRET: ${{ secrets.WARDROBE_OS_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ebay_deal_alert.py

      - name: Commit seen item updates
        run: |
          if [ -n "$(git status --porcelain seen_items.db ebay_token_cache.json alerts_log.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for file in seen_items.db ebay_token_cache.json alerts_log.jsonl; do
              if [ -e "$file" ]; then
                git add "$file"
              fi
            done
            git commit -m "chore: update seen items [skip ci]"
            git pull --rebase origin main && git push
          else
            echo "poll state files unchanged"
          fi

      # Independent failure-detection layer: pings healthchecks.io on
      # success, and separately on any earlier step failing. If neither
      # ping arrives within the check's grace window, healthchecks.io
      # alerts on its own - catches total bot death (expired keys, GitHub
      # account issues, runner outage) that the bot's own self-reporting
      # can't, since that fails when the whole process can't run at all.
      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}"

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 5 "${{ secrets.HEALTHCHECKS_PING_URL }}/fail"
