name: Poll eBay Deals

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-ebay-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eBay deal alert
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          WARDROBE_OS_URL: ${{ secrets.WARDROBE_OS_URL }}
          WARDROBE_OS_SECRET: ${{ secrets.WARDROBE_OS_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ebay_deal_alert.py

      - name: Commit seen item updates
        run: |
          if [ -n "$(git status --porcelain seen_items.db ebay_token_cache.json alerts_log.jsonl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for file in seen_items.db ebay_token_cache.json alerts_log.jsonl; do
              if [ -e "$file" ]; then
                git add "$file"
              fi
            done
            git commit -m "chore: update seen items [skip ci]"
            git pull --rebase origin main && git push
          else
            echo "poll state files unchanged"
          fi
